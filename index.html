<!DOCTYPE html>
<!-- saved from url=(0091)https://sc.ead.senai.br/pluginfile.php/1829925/mod_resource/content/1/1-1b_calculadora.html -->
<html lang="pt-br">
<head>
<meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calculadora</title>

<style>
    body {
        font-family: Arial, sans-serif;
        background-color: #e097e2;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        margin: 0;
    }

    .container {
        background: #aa38b4;
        padding: 25px;
        border-radius: 10px;
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        width: 100%;
        max-width: 320px;
        text-align: center;
    }

    h1 {
        margin-top: 0;
        color: #ffffff;
        font-size: 1.4rem;
    }

    .input-group {
        margin-bottom: 15px;
        text-align: left;
    }

    label {
        display: block;
        font-size: 0.85rem;
        color: #ffffff;
        margin-bottom: 5px;
    }

    input[type="number"] {
        width: 100%;
        padding: 8px;
        border: 1px solid #ccc;
        border-radius: 5px;
        box-sizing: border-box;
        font-size: 1rem;
    }

    .botones {
        display: flex;
        gap: 10px;
        margin-top: 15px;
    }

    button {
        flex: 1;
        padding: 10px;
        font-size: 1.2rem;
        border: none;
        border-radius: 5px;
        background-color: #e048c7;
        color: white;
        cursor: pointer;
    }

    button:hover {
        background-color: #d633c9;
    }

    .resultado {
        margin-top: 15px;
        padding: 10px;
        background-color: #e9ecef;
        border-radius: 5px;
        font-weight: bold;
        color: #333;
    }
</style>
</head>
<body>

<div class="container">
    <h1>Calculadora</h1>
    
    <div class="input-group">
    <label for="numero1">Primer número:</label>
    <input type="number" id="numero1" placeholder="Ingresa el primer número">
    </div>
    
    
    <div class="input-group">
    <label for="numero2">Segundo número:</label>
    <input type="number" id="numero2" placeholder="Ingresa el segundo número">
    </div>
    
    
    <div class="botones">
        <button onclick="realizarOperacion('+')">+</button>
        <button onclick="realizarOperacion('-')">−</button>
        <button onclick="realizarOperacion('*')">×</button>
        <button onclick="realizarOperacion('/')">÷</button>
    </div>
    
    
    <div id="resultado" class="resultado" style="display: none;">
    <span id="valorResultado"></span>
    </div>
</div>

<script>
    function realizarOperacion(operador) {
        const num1Input = document.getElementById('numero1').value;
        const num2Input = document.getElementById('numero2').value;
        const divResultado = document.getElementById('resultado');
        const spanResultado = document.getElementById('valorResultado');

        if (num1Input === '' || num2Input === '') {
            spanResultado.textContent = 'Ingresa ambos números';
            divResultado.style.display = 'block';
            return;
        }

        const num1 = parseFloat(num1Input);
        const num2 = parseFloat(num2Input);
        let res = 0;

        if (operador === '+') res = num1 + num2;
        if (operador === '-') res = num1 - num2;
        if (operador === '*') res = num1 * num2;
        if (operador === '/') {
            if (num2 === 0) {
                spanResultado.textContent = 'No se puede dividir entre 0';
                divResultado.style.display = 'block';
                return;
            }
            res = num1 / num2;
        }

        spanResultado.textContent = 'Resultado: ' + res;
        divResultado.style.display = 'block';
    }
</script>

</body>
</html>
